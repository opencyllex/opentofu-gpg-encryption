name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_wrapper: false
      - name: Install GnuPG (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes gnupg
      - name: Install GnuPG (macOS)
        if: runner.os == 'macOS'
        run: brew install gnupg
      - name: Install GnuPG (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install gnupg --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $directories = @("$env:ProgramFiles\GnuPG\bin", "${env:ProgramFiles(x86)}\GnuPG\bin")
          $installed = $directories | Where-Object { Test-Path -LiteralPath (Join-Path $_ 'gpg.exe') }
          if (-not $installed) { throw 'GnuPG installation directory not found' }
          $installed | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Check Go formatting
        shell: bash
        run: |
          files=$(gofmt -l cmd internal integration)
          if [ -n "$files" ]; then
            printf '%s\n' "$files"
            exit 1
          fi
      - name: Check OpenTofu example formatting
        run: tofu fmt -check -recursive examples
      - name: Vet
        run: go vet -tags integration ./...
      - name: Unit and integration tests
        run: go test -tags integration -v ./...
      - name: Check release configuration
        if: runner.os == 'Linux'
        uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: check
