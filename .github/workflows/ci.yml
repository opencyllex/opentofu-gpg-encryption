name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_wrapper: false
      - name: Install GnuPG (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes gnupg
      - name: Install GnuPG (macOS)
        if: runner.os == 'macOS'
        run: brew install gnupg
      - name: Set up GnuPG (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 5
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'gnupg-2.5.24.exe'
          $destination = Join-Path $env:RUNNER_TEMP 'gnupg'
          Invoke-WebRequest -Uri 'https://gnupg.org/ftp/gcrypt/binary/gnupg-w32-2.5.24_20260923.exe' -OutFile $archive -TimeoutSec 60
          $checksum = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash
          if ($checksum -ne 'EA6F9DEE2CCCD83287432625B8B399173805ADD81D27067FCAF019C0C4DA1AD8') { throw 'GnuPG archive checksum mismatch' }
          7z x $archive "-o$destination" -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bin = Join-Path $destination 'bin'
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & (Join-Path $bin 'gpg.exe') --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & (Join-Path $bin 'gpgconf.exe') --version
      - name: Check Go formatting
        shell: bash
        run: |
          gofmt -w cmd internal integration
          git diff --exit-code --ignore-cr-at-eol -- cmd internal integration
      - name: Check OpenTofu example formatting
        run: tofu fmt -check -recursive examples
      - name: Vet
        run: go vet -tags integration ./...
      - name: Unit and integration tests
        run: go test -tags integration -v ./...
      - name: Check release configuration
        if: runner.os == 'Linux'
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: check
