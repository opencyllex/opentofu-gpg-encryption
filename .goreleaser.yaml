# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2
project_name: opentofu-gpg-key-provider

release:
  draft: true

builds:
  - id: key-provider
    main: ./cmd/opentofu-gpg-key-provider
    binary: opentofu-gpg-key-provider
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE.md
      - examples/**

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
